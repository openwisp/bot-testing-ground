name: AI Review

on:
  workflow_call:
    inputs:
      wait_for_ci:
        type: boolean
        default: false
    secrets:
      APP_ID:
        required: true
      PRIVATE_KEY:
        required: true
      OPENCODE_AUTH:
        required: false

permissions: {}

jobs:
  gate:
    name: Check review request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event_name == 'issue_comment' &&
      github.repository_owner == 'openwisp' &&
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       (inputs.wait_for_ci && github.event.comment.user.type == 'Bot' &&
        startsWith(github.event.comment.body, '/ai-review-resume ')))
    # Registration and resumption must not claim the same stored request.
    concurrency:
      group: ai-review-coordinator-${{ github.repository }}
      queue: max
    permissions:
      contents: read # Checks CI entry points on the trusted base revision.
    outputs:
      stage: ${{ steps.coordinate.outputs.stage }}
      model: ${{ steps.coordinate.outputs.model }}
      head_sha: ${{ steps.coordinate.outputs.head_sha }}
      base_sha: ${{ steps.coordinate.outputs.base_sha }}
      base_ref: ${{ steps.coordinate.outputs.base_ref }}
      effort: ${{ steps.coordinate.outputs.effort }}
      comment_id: ${{ steps.coordinate.outputs.comment_id }}
      record_id: ${{ steps.coordinate.outputs.record_id }}
      ci_run_id: ${{ steps.coordinate.outputs.run_id }}
      ci_attempt: ${{ steps.coordinate.outputs.attempt }}
      ci_standard_status: ${{ steps.ci-standardization.outputs.status }}
      ci_standard_missing: ${{ steps.ci-standardization.outputs.missing }}
      runner: ${{ steps.runner.outputs.runner }}
    steps:
      - &trusted_checkout
        name: Checkout reusable workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: openwisp-actions
          persist-credentials: false

      - name: Parse command
        id: command
        env:
          BODY: ${{ github.event.comment.body }}
          PROVIDER: ${{ vars.OPENCODE_PROVIDER }}
          GENERAL_MODEL: ${{ vars.AI_REVIEW1_GENERAL_MODEL }}
          SECURITY_MODEL: ${{ vars.AI_REVIEW2_SECURITY_MODEL }}
          FINAL_MODEL: ${{ vars.AI_REVIEW3_FINAL_MODEL }}
          GENERAL_EFFORT: ${{ vars.AI_REVIEW1_GENERAL_EFFORT }}
          SECURITY_EFFORT: ${{ vars.AI_REVIEW2_SECURITY_EFFORT }}
          FINAL_EFFORT: ${{ vars.AI_REVIEW3_FINAL_EFFORT }}
        run: bash openwisp-actions/.github/actions/bot-ai-review/reusable/parse_command.sh

      - name: Generate read-only app token
        if: >
          steps.command.outputs.stage != '' ||
          (inputs.wait_for_ci && github.event.comment.user.type == 'Bot' &&
          startsWith(github.event.comment.body, '/ai-review-resume '))
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-members: read
          permission-pull-requests: read

      - name: Verify organization membership
        if: steps.command.outputs.stage != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          USER_LOGIN: ${{ github.event.comment.user.login }}
        run: gh api "orgs/$ORG/members/$USER_LOGIN" --silent

      - name: Read pull request
        if: steps.command.outputs.stage != ''
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: bash openwisp-actions/.github/actions/bot-ai-review/reusable/read_pull_request.sh

      - name: Generate CI coordinator token
        if: >
          inputs.wait_for_ci && (steps.command.outputs.stage != '' ||
          (github.event.comment.user.type == 'Bot' &&
          startsWith(github.event.comment.body, '/ai-review-resume ')))
        id: ci-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-pull-requests: write
          permission-actions: read

      - name: Coordinate review request
        if: >
          steps.command.outputs.stage != '' ||
          (inputs.wait_for_ci && github.event.comment.user.type == 'Bot' &&
          startsWith(github.event.comment.body, '/ai-review-resume '))
        id: coordinate
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token || steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          APP_ID: ${{ secrets.APP_ID }}
          CI_STATE_KEY: ${{ inputs.wait_for_ci && secrets.PRIVATE_KEY || '' }}
          CI_ENABLED: ${{ inputs.wait_for_ci }}
          STAGE: ${{ steps.command.outputs.stage }}
          MODEL: ${{ steps.command.outputs.model }}
          EFFORT: ${{ steps.command.outputs.effort }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: python3 openwisp-actions/.github/actions/bot-ai-review/reusable/coordinate_review.py

      - name: Check CI entry points
        if: steps.coordinate.outputs.stage != ''
        id: ci-standardization
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.coordinate.outputs.base_sha }}
          BASE_REF: ${{ steps.coordinate.outputs.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 openwisp-actions/.github/actions/bot-ai-review/reusable/check_ci_standardization.py

      - name: Select review runner
        if: steps.coordinate.outputs.stage != ''
        id: runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.coordinate.outputs.base_sha }}
        run: bash openwisp-actions/.github/actions/ci-dependencies/reusable/select_runner.sh

      - name: Generate shared guidance token
        if: steps.coordinate.outputs.stage != ''
        id: guidance-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: openwisp-opencode-configs
          permission-contents: read

      - name: Fetch shared AI guidance
        if: steps.coordinate.outputs.stage != ''
        env:
          GH_TOKEN: ${{ steps.guidance-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: bash openwisp-actions/.github/actions/bot-ai-review/reusable/fetch_shared_guidance.sh

      - name: Upload shared AI guidance
        if: steps.coordinate.outputs.stage != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-review-shared-guidance
          path: ${{ runner.temp }}/shared-guidance
          retention-days: 1

  acknowledge:
    name: Add eyes reaction
    needs: gate
    if: needs.gate.outputs.stage != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      reaction_id: ${{ steps.reaction.outputs.reaction_id }}
    steps:
      - name: Generate write app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Add eyes reaction
        id: reaction
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          COMMENT_ID: ${{ needs.gate.outputs.comment_id }}
        run: |
          echo "reaction_id=$(gh api -X POST "repos/$REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes --jq '.id')" >> "$GITHUB_OUTPUT"

  review:
    name: Run ${{ needs.gate.outputs.stage }}
    needs: gate
    if: needs.gate.outputs.stage != ''
    runs-on: ${{ needs.gate.outputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      PR_DIR: /tmp/ai-review/pr
      DATA_DIR: /tmp/ai-review/data
    concurrency:
      group: >-
        ${{ format('ai-review-{0}-{1}-{2}', github.repository, github.event.issue.number,
        needs.gate.outputs.stage) }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: read # Reads the issues linked in the pull request description.
      pull-requests: read # Reads the pull request description, reviews and comments.
    outputs:
      setup_failed: ${{ steps.deps.outcome == 'failure' }}
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - *trusted_checkout

      - name: Verify pull request is still current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          BASE_REF: ${{ needs.gate.outputs.base_ref }}
        run: bash openwisp-actions/.github/actions/bot-ai-review/reusable/verify_pull_request.sh

      - name: Fetch pull request as data
        # Keep credentials in this step, not in Git config accessible to the sandbox.
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: "!gh auth git-credential"
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          BASE_SHA: ${{ needs.gate.outputs.base_sha }}
        run: bash openwisp-actions/.github/actions/bot-ai-review/reusable/fetch_pull_request.sh

      - name: Generate CI results token
        if: needs.gate.outputs.ci_run_id != ''
        id: ci-results-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-actions: read

      - name: Fetch selected CI results
        if: needs.gate.outputs.ci_run_id != ''
        env:
          GH_TOKEN: ${{ steps.ci-results-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ needs.gate.outputs.ci_run_id }}
          CI_ATTEMPT: ${{ needs.gate.outputs.ci_attempt }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        run: python3 openwisp-actions/.github/actions/bot-ai-review/reusable/fetch_ci_results.py

      - name: Fetch threat model
        if: needs.gate.outputs.stage == 'review'
        run: bash openwisp-actions/.github/actions/bot-ai-review/reusable/fetch_threat_model.sh

      - name: Download shared AI guidance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review-shared-guidance
          path: ${{ runner.temp }}/shared-guidance

      - name: Prepare sandbox user
        run: bash openwisp-actions/.github/actions/bot-ai-review/reusable/prepare_sandbox.sh

      - name: Detect standardized CI
        if: ${{ hashFiles('install-ci-deps.sh') != '' }}
        id: ci-detect
        env:
          CI_ROOT: ${{ github.workspace }}
        run: bash openwisp-actions/.github/actions/ci-dependencies/reusable/detect_ci.sh

      - name: Select CI environment
        if: steps.ci-detect.outputs.enabled == 'true'
        id: ci
        env:
          CI_ROOT: ${{ github.workspace }}
          REVIEW_MATRIX_OVERRIDE: ${{ vars.AI_REVIEW_MATRIX_OVERRIDE }}
        run: bash openwisp-actions/.github/actions/ci-dependencies/reusable/select_environment.sh

      - name: Set up CI Python
        if: steps.ci.outputs.python_version != ''
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.ci.outputs.python_version }}

      - name: Set up CI Node.js
        if: steps.ci.outputs.node_version_file != '' || steps.ci.outputs.node_version != ''
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ steps.ci.outputs.node_version_file }}
          node-version: ${{ steps.ci.outputs.node_version }}

      - name: Set up QA Python
        if: >-
          (steps.ci.outputs.node_version_file != '' || steps.ci.outputs.node_version != '') &&
          steps.ci.outputs.python_version == ''
        id: qa-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Set up Chrome and ChromeDriver
        if: steps.ci.outputs.chrome == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Check Firefox and GeckoDriver
        if: steps.ci.outputs.firefox == 'true'
        id: firefox
        run: |
          firefox --version
          geckodriver --version
          echo "firefox_path=$(command -v firefox)" >> "$GITHUB_OUTPUT"

      - name: Identify runner image
        if: steps.ci.outcome == 'success'
        id: platform
        run: echo "image_os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Locate Yarn cache
        if: hashFiles('yarn.lock') != '' && steps.node.outcome == 'success'
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Restore Python cache
        if: steps.ci.outputs.python_version != '' && steps.ci.outputs.django_version == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: >-
            ${{ format('{0}-{1}-{2}-pip-{3}-{4}', runner.os, runner.arch,
                steps.platform.outputs.image_os, steps.python.outputs.python-version,
                hashFiles('requirements-test.txt', 'requirements.txt', 'requirements-qa.txt', 'setup.py',
                'install-ci-deps.sh', 'install-dev.sh')) }}

      - name: Restore Django cache
        if: steps.ci.outputs.django_version != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: >-
            ${{ format('{0}-{1}-{2}-pip-{3}-{4}-{5}', runner.os, runner.arch,
                steps.platform.outputs.image_os, steps.python.outputs.python-version,
                steps.ci.outputs.django_version, hashFiles('setup.py', 'requirements-test.txt',
                'requirements.txt', 'install-ci-deps.sh')) }}

      - name: Restore Yarn cache
        if: hashFiles('yarn.lock') != '' && steps.node.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Matching children keeps tar from including excluded build files.
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            node_modules/*
            !node_modules/.cache
            !node_modules/.cache/**
          key: >-
            ${{ format('{0}-{1}-{2}-yarn-{3}-{4}', runner.os, runner.arch,
                steps.platform.outputs.image_os, steps.node.outputs.node-version,
                hashFiles('yarn.lock', 'package.json', '.nvmrc', 'install-ci-deps.sh')) }}

      - name: Restore QA Python cache
        if: steps.qa-python.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: >-
            ${{ format('{0}-{1}-{2}-pip-qa-{3}-{4}', runner.os, runner.arch,
                steps.platform.outputs.image_os, steps.qa-python.outputs.python-version,
                hashFiles('install-ci-deps.sh')) }}

      # Repositories can cache downloads such as Ansible roles and collections in
      # ~/.cache/ci-deps. APT downloads are included only if the installer puts them there.
      - name: Restore other dependency downloads
        if: steps.ci.outputs.extra_cache_glob != ''
        uses: $/.github/actions/ci-cache
        with:
          mode: restore
          dependency-glob: ${{ steps.ci.outputs.extra_cache_glob }}
          image-os: ${{ steps.platform.outputs.image_os }}
          python-version: ${{ steps.python.outputs.python-version || steps.qa-python.outputs.python-version }}
          node-version: ${{ steps.node.outputs.node-version }}
          django-version: ${{ steps.ci.outputs.django_version }}
          variant: ${{ steps.ci.outputs.extra_cache_variant }}

      - name: Install OpenCode
        # The exact OpenCode release is pinned.
        run: npm install -g opencode-ai@1.18.35 # zizmor: ignore[adhoc-packages]

      - name: Install trusted CI dependencies
        if: steps.ci.outcome == 'success'
        id: deps
        env:
          DEFAULT_SHA: ${{ github.sha }} # issue_comment runs at the caller's default branch.
          PREPARE_PYTHON: ${{ steps.python.outcome == 'success' || steps.qa-python.outcome == 'success' }}
          DJANGO_VERSION: ${{ steps.ci.outputs.django_version }}
          YARN_CACHE_DIR: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          CI_QA: ${{ steps.node.outcome == 'success' && '1' || '0' }}
          SYSTEM_DEPS_ENABLED: ${{ steps.ci.outputs.system_deps }}
          INSTALLER_ENV: ${{ steps.ci.outputs.installer_env }}
        run: bash openwisp-actions/.github/actions/ci-dependencies/reusable/prepare_review.sh

      - name: Configure provider credentials
        if: vars.OPENCODE_PROVIDER == 'github-copilot'
        env:
          OPENCODE_AUTH: ${{ secrets.OPENCODE_AUTH }}
        run: bash openwisp-actions/.github/actions/bot-ai-review/reusable/configure_credentials.sh

      - name: Fetch pull request discussion
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ""
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: bash openwisp-actions/.github/actions/bot-ai-review/reusable/fetch_history.sh

      - name: Run review
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ""
          MODEL: ${{ needs.gate.outputs.model }}
          STAGE: ${{ needs.gate.outputs.stage }}
          EFFORT: ${{ needs.gate.outputs.effort }}
          SE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          SE_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          GECKO_BIN: ${{ steps.firefox.outputs.firefox_path }}
        run: bash openwisp-actions/.github/actions/bot-ai-review/reusable/run_review.sh

      - name: Upload findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-review-findings
          path: ${{ runner.temp }}/findings.json
          retention-days: 1

  publish:
    name: Publish review
    needs: [gate, review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: >-
        ${{ format('ai-review-{0}-{1}-{2}-publish', github.repository, github.event.issue.number,
        needs.gate.outputs.stage) }}
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      review_url: ${{ steps.publish.outputs.review_url }}
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *trusted_checkout

      - name: Download findings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review-findings
          path: ${{ runner.temp }}/findings

      - name: Check for inline comments
        id: comments
        env:
          FINDINGS: ${{ runner.temp }}/findings/findings.json
        run: echo "present=$(jq -r '.comments | length > 0' "$FINDINGS")" >> "$GITHUB_OUTPUT"

      - name: Install Crit
        if: steps.comments.outputs.present == 'true'
        run: bash openwisp-actions/.github/actions/bot-ai-review/reusable/install_crit.sh

      - name: Fetch pull request for publication
        # The workflow token can read private repositories without requiring
        # existing App installations to grant an additional Contents permission.
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: "!gh auth git-credential"
          PR_NUMBER: ${{ github.event.issue.number }}
        run: git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"

      - name: Generate write app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Publish review
        id: publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          MODEL: ${{ needs.gate.outputs.model }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          BASE_REF: ${{ needs.gate.outputs.base_ref }}
          STAGE: ${{ needs.gate.outputs.stage }}
          FINDINGS: ${{ runner.temp }}/findings/findings.json
          CI_STANDARD_STATUS: ${{ needs.gate.outputs.ci_standard_status }}
          CI_STANDARD_MISSING: ${{ needs.gate.outputs.ci_standard_missing }}
          CI_AWARE: ${{ inputs.wait_for_ci }}
          RECORD_ID: ${{ needs.gate.outputs.record_id }}
        run: bash openwisp-actions/.github/actions/bot-ai-review/reusable/publish.sh

  react:
    name: Update reaction
    needs: [gate, acknowledge, review, publish]
    if: always() && needs.acknowledge.outputs.reaction_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - *trusted_checkout

      - name: Generate write app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Replace eyes reaction
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          COMMENT_ID: ${{ needs.gate.outputs.comment_id }}
          REACTION_ID: ${{ needs.acknowledge.outputs.reaction_id }}
          REVIEW_RESULT: ${{ needs.review.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: bash openwisp-actions/.github/actions/bot-ai-review/reusable/update_reaction.sh

  finish-ci-request:
    name: Complete CI-aware request
    needs: [gate, review, publish]
    if: always() && needs.gate.outputs.record_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ai-review-coordinator-${{ github.repository }}
      queue: max
    permissions:
      contents: read
    steps:
      - *trusted_checkout

      - name: Generate write app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Finish request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          APP_ID: ${{ secrets.APP_ID }}
          CI_STATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RECORD_ID: ${{ needs.gate.outputs.record_id }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          REVIEW_URL: ${{ needs.publish.outputs.review_url }}
          SETUP_FAILED: ${{ needs.review.outputs.setup_failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 openwisp-actions/.github/actions/bot-ai-review/reusable/finish_ci_request.py

  ci-completion:
    name: Resume CI-aware reviews
    if: >
      inputs.wait_for_ci && github.event_name == 'workflow_run' &&
      github.repository_owner == 'openwisp' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - *trusted_checkout

      - name: Generate CI coordinator token
        id: ci-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Wake pending requests
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          APP_ID: ${{ secrets.APP_ID }}
          CI_STATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: python3 openwisp-actions/.github/actions/bot-ai-review/reusable/ci_completion.py
