# Provide a slow primary CI run for the on-demand review integration fixture.
name: CI / review fixture

on:
  pull_request:
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: ci-aware-fixture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"
      - name: Identify runner image
        id: platform
        run: echo "image_os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cache pip downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: >-
            ${{ format('{0}-{1}-{2}-pip-{3}-{4}', runner.os, runner.arch,
                steps.platform.outputs.image_os, steps.python.outputs.python-version,
                hashFiles('requirements-test.txt', 'requirements.txt', 'requirements-qa.txt', 'setup.py',
                'install-ci-deps.sh', 'install-dev.sh')) }}
      - name: Install test dependencies
        id: deps
        run: ./install-ci-deps.sh
      - name: Run tests
        run: ./runtests -q
      - name: Complete the requested fixture scenario
        if: github.event_name == 'pull_request'
        env:
          FAIL_SCENARIO: ${{ contains(github.head_ref, 'ci-aware-failure') }}
        run: |
          sleep 90
          test "$FAIL_SCENARIO" != true
