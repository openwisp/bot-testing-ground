name: PR Reopen Reassignment
on:
  # Stale fork PR updates run trusted bot code only.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [reopened]
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: bot-autoassign-pr-reopen-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
jobs:
  reassign-on-reopen:
    if: >
      github.repository == 'openwisp/bot-testing-ground' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'reopened'
    uses: openwisp/openwisp-actions/.github/workflows/reusable-bot-autoassign.yml@d6cc603701fe96a84115b060d34e8844a969cc41 # 0.3.0
    with:
      bot_command: pr_reopen
    secrets:
      OPENWISP_BOT_APP_ID: ${{ secrets.OPENWISP_BOT_APP_ID }}
      OPENWISP_BOT_PRIVATE_KEY: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
  handle-pr-activity:
    if: >
      github.repository == 'openwisp/bot-testing-ground' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.user.login == github.event.comment.user.login
    uses: openwisp/openwisp-actions/.github/workflows/reusable-bot-autoassign.yml@d6cc603701fe96a84115b060d34e8844a969cc41 # 0.3.0
    with:
      bot_command: pr_reopen
    secrets:
      OPENWISP_BOT_APP_ID: ${{ secrets.OPENWISP_BOT_APP_ID }}
      OPENWISP_BOT_PRIVATE_KEY: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
